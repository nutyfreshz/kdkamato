name: Final UI viewport QA

on:
  push:
    branches:
      - ui-final-polish-20260912
  workflow_dispatch:

jobs:
  viewport-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies
        run: npm install

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exact viewport QA
        run: npx playwright test --config=playwright.final.config.js
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-ui-qa-evidence
          path: |
            test-results/
          if-no-files-found: warn
          retention-days: 3
