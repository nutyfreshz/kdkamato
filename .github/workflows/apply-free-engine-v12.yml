name: Apply FREE Engine v1.2

on:
  push:
    branches: [main]
    paths:
      - tools/apply_free_engine_v12.py
      - .github/workflows/apply-free-engine-v12.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply candidate
        run: python tools/apply_free_engine_v12.py
      - name: Synthetic matrix
        run: node supabase/functions/kdk-free-program/synthetic-test.mjs
      - name: Quality audit
        run: node supabase/functions/kdk-free-program/quality-audit.mjs
      - name: Commit validated engine
        run: |
          if git diff --quiet -- supabase/functions/kdk-free-program/engine.mjs supabase/functions/kdk-free-program/index.ts app/program/preview/page.tsx supabase/functions/kdk-free-program/quality-audit.mjs; then
            echo "No runtime changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/kdk-free-program/engine.mjs supabase/functions/kdk-free-program/index.ts app/program/preview/page.tsx supabase/functions/kdk-free-program/quality-audit.mjs
          git commit -m "feat: harden FREE engine v1.2"
          git push origin HEAD:main
