name: Production UI regression

on:
  push:
    branches:
      - ui-final-polish-20260912

jobs:
  production-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Production viewport regression
        run: npx playwright test --config=playwright.production.config.js
      - name: Upload Production QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ui-qa-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 3
